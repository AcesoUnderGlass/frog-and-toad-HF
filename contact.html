<body class="about-page">
<main class="sheet">
  <h1>Contact</h1>
  <hr class="rule">

  <!-- The form is delivered by Web3Forms (web3forms.com), which emails each
       message to the address the access key below was created for. To send
       mail somewhere else, make a new key there and replace this one. -->
  <form class="contact-form" id="contactForm" action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="fd710089-19a2-4441-947d-6888e86efa29">
    <input type="hidden" name="subject" value="Message from frogandtoad.ai">
    <input type="hidden" name="from_name" value="Frog and Toad contact form">
    <!-- Hidden from people; bots that fill it in are dropped. -->
    <input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label>Your name
      <input type="text" name="name" autocomplete="name" required>
    </label>
    <label>Your email
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>Message
      <textarea name="message" rows="6" required></textarea>
    </label>
    <button type="submit">Send</button>
    <p class="form-note" id="formNote" role="status"></p>
  </form>

  <h2>Elsewhere</h2>
  <p>You can also reach us through one of the book's accounts:</p>
  <p><a href="https://frogandtoadai.substack.com/?r=64iai2&utm_campaign=pub-share-checklist" target="_blank" rel="noopener">Substack</a></p>
  <p><a href="https://x.com/frogandtoad_ai" target="_blank" rel="noopener">Twitter</a></p>
  <p><a href="https://www.facebook.com/people/Frog-and-Toad-Learn-About-AI/61594283794206/" target="_blank" rel="noopener">Facebook</a></p>
  <p><a href="https://www.instagram.com/frogandtoad_ai/" target="_blank" rel="noopener">Instagram</a></p>

  <p class="back"><a href="index.html">&#8249; Back to the book</a> · <a href="about.html">About</a></p>
</main>
<script>
  // Send the form in place and show the result here, instead of leaving for
  // Web3Forms' own thank-you page. Without JavaScript the form still posts normally.
  (function () {
    const form = document.getElementById('contactForm');
    const note = document.getElementById('formNote');
    const button = form.querySelector('button');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      button.disabled = true;
      note.className = 'form-note';
      note.textContent = 'Sending…';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        form.reset();
        note.textContent = 'Thank you. Your message has been sent.';
      } catch (err) {
        note.className = 'form-note error';
        note.textContent = 'Sorry, the message could not be sent. Please try again, or use one of the accounts below.';
      }
      button.disabled = false;
    });
  })();
</script>
</body>
</html>
