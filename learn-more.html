<script>
  // Leave once the Google Ads conversion has been sent (its event_callback,
  // declared in the head, calls this), or after a timeout if Google never
  // answers, e.g. because an ad blocker stopped gtag.js. Either way the
  // Vercel analytics beacon gets a moment to send first.
  var left = false;
  var openedAt = Date.now();
  window.leaveForArticle = function () {
    if (left) return;
    var wait = 400 - (Date.now() - openedAt);
    if (wait > 0) return setTimeout(window.leaveForArticle, wait);
    left = true;
    location.replace('https://huggingface.wtf');
  };
  setTimeout(window.leaveForArticle, 1500);
</script>
