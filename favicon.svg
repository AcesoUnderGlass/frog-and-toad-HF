<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .ink{fill:none;stroke:#3b3225;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .pencil{fill:none;stroke:#3b3225;stroke-width:0.9;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
      .hatch{fill:none;stroke:#7a6a3a;stroke-width:0.8;stroke-linecap:round;opacity:.55}
    </style>
  </defs>

  <!-- face: sallow, slightly lopsided wash with a pencil outline -->
  <path d="M32 7.5 q14 -0.5 20 12 q4 9 0 19 q-6 12 -20 12.5 q-14 -0.5 -20 -12.5 q-4 -10 0 -19 q6 -12.5 20 -12 z" fill="#b9a656"/>
  <!-- lighter wash, leaving a shadow crescent along the lower right -->
  <circle cx="30.3" cy="27" r="18.6" fill="#d6c46c"/>
  <path d="M32 7.5 q14 -0.5 20 12 q4 9 0 19 q-6 12 -20 12.5 q-14 -0.5 -20 -12.5 q-4 -10 0 -19 q6 -12.5 20 -12 z" class="ink"/>
  <path d="M33 9 q13 0 18.5 11.5 M12.5 22 q2 -8 9 -11.5" class="pencil"/>

  <!-- pencil hatching, lower right -->
  <g class="hatch">
    <path d="M40 44 l5 -4 M43 46 l6 -5 M46 47 l5 -5 M48.5 43.5 l3.5 -3.5 M50 39 l2.5 -2.5"/>
    <path d="M16 42 l3 -2.5 M14 38 l2.5 -2"/>
  </g>

  <!-- blush -->
  <ellipse cx="19" cy="31.5" rx="4.2" ry="2.4" fill="#c7895a" opacity=".45"/>
  <ellipse cx="45" cy="31.5" rx="4.2" ry="2.4" fill="#c7895a" opacity=".45"/>
  <path d="M16.5 32.5 l1.5 -1.8 M19 33 l1.6 -1.9 M43 33 l1.6 -1.9 M45.5 32.5 l1.5 -1.8" class="pencil"/>

  <!-- happy closed eyes -->
  <path d="M20.5 25.5 q4.5 -5.5 9 0" class="ink"/>
  <path d="M34.5 25.5 q4.5 -5.5 9 0" class="ink"/>
  <!-- smile -->
  <path d="M22.5 33 q9.5 10 19 0" class="ink"/>

  <!-- hands: palms facing in, thumbs up, like the emoji -->
  <g id="hand">
    <path d="M7 62 L6 52 L6.5 45.5 Q6.5 43 8.3 43 Q10 43 10 45.5 L10.3 42.5 Q10.5 40 12.2 40 Q14 40 14 42.5 L14.2 41.5 Q14.5 39 16.2 39 Q18 39 18 41.5 L18.2 43 Q18.5 40.5 20.2 40.5 Q22 40.5 22 43 L22 48 Q23 46.5 26 44.5 Q28.5 43.5 28.9 45.5 Q29.2 47.5 26.5 49.5 L23.5 53 Q23.5 60 20.5 62 Z" fill="#cfb95f"/>
    <path d="M7 62 L6 52 L6.5 45.5 Q6.5 43 8.3 43 Q10 43 10 45.5 L10.3 42.5 Q10.5 40 12.2 40 Q14 40 14 42.5 L14.2 41.5 Q14.5 39 16.2 39 Q18 39 18 41.5 L18.2 43 Q18.5 40.5 20.2 40.5 Q22 40.5 22 43 L22 48 Q23 46.5 26 44.5 Q28.5 43.5 28.9 45.5 Q29.2 47.5 26.5 49.5 L23.5 53 Q23.5 60 20.5 62 Z" class="ink"/>
    <path d="M10 45.5 v4.5 M14 42.5 v6 M18 43 v6" class="ink"/>
    <path d="M9 55 l4 -1 M9.5 58 l5 -1.2" class="hatch"/>
  </g>
  <use href="#hand" transform="matrix(-1 0 0 1 64 0)"/>
</svg>
